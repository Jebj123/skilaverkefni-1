name: Test-Our-App

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-file: [articles.test.js, authors.test.js, errorHandler.test.js, validation.test.js]
    steps:
      - uses: actions/checkout@v4

      - name: Setja upp nodejs
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setja upp pakka
        run: npm ci

      - name: Keyra ${{ matrix.test-file }}
        id: test
        run: npm test -- ${{ matrix.test-file }}

      - name: Test féll!
        if: failure() && steps.test.outcome == 'failure'
        run: echo "${{ matrix.test-file }} féll"

      - name: Test tókst!
        if: steps.test.outcome == 'success'
        run: echo "${{ matrix.test-file }} stóðst"